name: validate

on:
  push:
    branches: ["**"]
  pull_request:

# Least privilege: this workflow only reads the repo and runs validators.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skills:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"

      - name: Validate skill frontmatter
        run: python3 scripts/validate_skills.py

      - name: Test validator edge cases
        run: python3 scripts/test_validate_skills.py

      - name: Validate example outputs against manifests
        run: python3 scripts/validate_examples.py

      - name: Check catalog is up to date
        run: |
          python3 scripts/generate_catalog.py
          if ! git diff --exit-code docs/CATALOG.md; then
            echo "::error::docs/CATALOG.md is stale. Run 'python3 scripts/generate_catalog.py' and commit."
            exit 1
          fi

      - name: Validate skill-rules.json and rule/skill coverage
        run: node scripts/check-rules.mjs

      - name: Validate Codex plugin package
        run: python3 scripts/validate_plugin.py

      - name: Validate release truth
        run: python3 scripts/validate_release.py

      - name: Validate Second Brain projection and boundary tests
        run: |
          python3 scripts/build_second_brain_plugin.py --check
          python3 -m unittest discover -s skills/substrate/visualize-knowledge/tests -v
